spring.application.name=calendar-backend
jwt.secret-base64=${JWT_SECRET_BASE64}
jwt.access-token-expiration-seconds=3600
jwt.issuer=calendar-backend
jwt.refresh-token-expiration-seconds=2592000
spring.datasource.url=jdbc:postgresql://localhost:5432/Calendar
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
